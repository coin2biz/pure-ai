<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background:#0a0a0a;color:white;text-align:center;padding:20px;font-family:monospace">

<h2>PURE AI TOKEN</h2>
<div id="bal" style="font-size:40px;border:1px dashed white;padding:15px;margin:20px">0 $PURE</div>
<button onclick="tap()" style="width:180px;height:180px;border-radius:50%;font-size:30px">PURE</button>
<div id="energy" style="margin-top:20px">Energy: 1000/1000</div>

<script>
let b=0; let e=1000;
const tg=Telegram.WebApp; tg.ready(); tg.expand();
function tap(){
 if(e<1) return;
 b++; e--; 
 document.getElementById('bal').innerText=b+' $PURE';
 document.getElementById('energy').innerText='Energy: '+e+'/1000';
 tg.HapticFeedback.impactOccurred('light');
}
setInterval(()=>{ b++; e=Math.min(e+1,1000); document.getElementById('bal').innerText=b+' $PURE'; document.getElementById('energy').innerText='Energy: '+e+'/1000'; },1000);
</script>
</body>
</html>
